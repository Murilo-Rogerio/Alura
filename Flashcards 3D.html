<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            900: '#164e63',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 3D Engine Setup */
        .perspective-1200 {
            perspective: 1200px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Smooth Tilt & Flip Dynamics */
        .card-stage {
            transition: transform 0.15s cubic-bezier(0.03, 0.98, 0.52, 0.99), box-shadow 0.25s ease;
            will-change: transform;
        }

        .card-flipper {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Dynamic Lighting / Glare Shimmer */
        .glare-overlay {
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 75%);
            pointer-events: none;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300 antialiased selection:bg-cyan-500 selection:text-white">

    <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex items-center justify-between shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-cyan-500/20">
                <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <div>
                <!-- Nome alterado conforme solicitação -->
                <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-400 bg-clip-text text-transparent">
                    Flashcards
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Grade 3D Interativa • Estudo e Memorização</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Deck Selector -->
            <select id="deckSelect" class="bg-slate-800 text-slate-200 border border-slate-700 text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none px-3 py-2 cursor-pointer max-w-[160px] sm:max-w-xs font-medium">
                <!-- Populado via JS -->
            </select>

            <!-- Button: Add Card -->
            <button onclick="abrirModalCriar()" class="flex items-center gap-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all shadow-lg shadow-cyan-600/20 active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Criar Card</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center p-4 sm:p-6 md:p-8 max-w-7xl mx-auto w-full gap-6">

        <!-- Toolbar & Statistics Bar -->
        <div class="w-full flex flex-wrap items-center justify-between gap-4 bg-slate-900/70 p-4 rounded-2xl border border-slate-800/80 backdrop-blur shadow-xl">
            <div class="flex items-center gap-3">
                <span id="deckBadge" class="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-full text-xs font-semibold uppercase tracking-wider">
                    Sistemas Web
                </span>
                <span id="pageCounter" class="text-xs text-slate-400 font-medium">
                    Exibindo cards 1-3 de 6
                </span>
            </div>

            <!-- Global Action Buttons -->
            <div class="flex items-center gap-2">
                <button onclick="virarTodosCards()" title="Girar Todos os Cards da Página" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition-all active:scale-95">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-cyan-400"></i>
                    <span>Virar Todos</span>
                </button>
                <button onclick="embaralharCards()" title="Embaralhar Cards" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-all border border-slate-700 active:scale-95">
                    <i data-lucide="shuffle" class="w-4 h-4"></i>
                </button>
                <button onclick="reiniciarSessao()" title="Reiniciar Progresso" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-all border border-slate-700 active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- 3-CARD DESKTOP GRID CONTAINER -->
        <!-- Mobile: 1 coluna, Tablet: 2 colunas, PC/Desktop: Exatamente 3 colunas simultâneas -->
        <div id="cardsGrid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 my-auto py-2">
            <!-- Cards injetados via JS -->
        </div>

        <!-- Navigation & Progress Controls -->
        <div class="w-full max-w-2xl flex flex-col gap-4 mt-auto">
            <!-- Navigation Buttons -->
            <div class="flex items-center justify-between gap-4">
                <button onclick="paginaAnterior()" id="btnPrevPage" class="flex items-center gap-2 px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 rounded-xl font-medium transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Página Anterior</span>
                </button>

                <div class="text-xs text-slate-400 font-medium hidden sm:block">
                    Use <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-[10px]">←</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-[10px]">→</kbd> para navegar
                </div>

                <button onclick="proximaPagina()" id="btnNextPage" class="flex items-center gap-2 px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 rounded-xl font-medium transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg">
                    <span>Próxima Página</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Global Score Progress Bar -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col gap-2.5 shadow-xl">
                <div class="flex justify-between text-xs font-semibold">
                    <span class="text-emerald-400 flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        Já Sei: <span id="countSabe">0</span> cards
                    </span>
                    <span class="text-amber-400 flex items-center gap-1.5">
                        <i data-lucide="help-circle" class="w-4 h-4"></i>
                        Revisar: <span id="countPraticar">0</span> cards
                    </span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden flex p-0.5 border border-slate-700/50">
                    <div id="barSabe" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    <div id="barPraticar" class="bg-gradient-to-r from-amber-500 to-rose-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Adicionar Novo Card -->
    <div id="modalCriar" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col gap-5 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-cyan-400"></i>
                    Criar Novo Flashcard
                </h3>
                <button onclick="fecharModalCriar()" class="text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="formCriarCard" onsubmit="salvarNovoCard(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Escolha o Deck</label>
                    <select id="novoCardDeck" class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                        <!-- Preenchido via JS -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Frente (Pergunta / Conceito)</label>
                    <textarea id="novoCardPergunta" required rows="3" placeholder="Ex: O que é o DOM no JavaScript?" class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Verso (Resposta / Explicação)</label>
                    <textarea id="novoCardResposta" required rows="3" placeholder="Ex: É a representação em árvore de objetos do documento HTML..." class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 mt-2">
                    <button type="button" onclick="fecharModalCriar()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-sm font-medium rounded-xl shadow-lg shadow-cyan-600/20 transition-all">
                        Salvar Card
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Decks e dados pré-carregados estendidos para demonstrar suporte a múltiplos cards
        const initialDecks = [
            {
                id: 'web',
                nome: 'Sistemas Web',
                cards: [
                    {
                        pergunta: 'O que faz a propriedade CSS <code>transform-style: preserve-3d</code>?',
                        resposta: 'Garante que os elementos filhos de um container sejam renderizados no espaço tridimensional real, permitindo rotação e profundidade 3D.'
                    },
                    {
                        pergunta: 'Como funciona o efeito de Giroscópio/Tilt no MouseMove?',
                        resposta: 'Calcula a distância relativa do ponteiro do mouse até o centro do cartão para aplicar rotações proporcionais nos eixos X e Y em tempo real.'
                    },
                    {
                        pergunta: 'O que é a API Web storage (localStorage vs sessionStorage)?',
                        resposta: '<code>localStorage</code> armazena dados sem expiração. <code>sessionStorage</code> mantém os dados apenas durante a sessão do navegador.'
                    },
                    {
                        pergunta: 'Qual a utilidade do atributo CSS <code>backface-visibility: hidden</code>?',
                        resposta: 'Oculta o lado posterior de um elemento quando ele estiver virado de costas para a tela durante uma rotação 3D.'
                    },
                    {
                        pergunta: 'O que é o Virtual DOM no desenvolvimento moderno?',
                        resposta: 'Uma representação leve em memória da árvore DOM real para comparar mudanças (diffing) e atualizar apenas partes necessárias na tela.'
                    },
                    {
                        pergunta: 'Qual a diferença entre o protocolo HTTP e HTTPS?',
                        resposta: 'O HTTPS utiliza criptografia SSL/TLS para proteger a comunicação de dados contra interceptação (Man-in-the-middle).'
                    }
                ]
            },
            {
                id: 'prog',
                nome: 'Programação Avançada',
                cards: [
                    {
                        pergunta: 'O que é o padrão de projeto Singleton?',
                        resposta: 'Um padrão de criação de software que garante a existência de apenas uma instância de uma determinada classe em toda a aplicação.'
                    },
                    {
                        pergunta: 'Como funciona a recursividade em algoritmos?',
                        resposta: 'É a capacidade de uma função chamar a si mesma repetidamente até atingir uma condição base de parada.'
                    },
                    {
                        pergunta: 'O que é um Closure no JavaScript?',
                        resposta: 'A combinação de uma função empacotada com referências ao seu estado léxico ao redor (permite acesso a variáveis da função pai).'
                    },
                    {
                        pergunta: 'Qual a diferença entre compilação e interpretação?',
                        resposta: 'Linguagens compiladas são traduzidas diretamente para código de máquina antes da execução. Interpretadas são traduzidas linha a linha durante a execução.'
                    }
                ]
            },
            {
                id: 'eng',
                nome: 'Engenharia de Software',
                cards: [
                    {
                        pergunta: 'O que significa a sigla SOLID?',
                        resposta: 'São 5 princípios de design de código OO: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation e Dependency Inversion.'
                    },
                    {
                        pergunta: 'Qual o objetivo principal dos Testes Unitários?',
                        resposta: 'Validar o correto funcionamento das menores unidades isoladas de código da aplicação (funções, métodos, classes).'
                    },
                    {
                        pergunta: 'O que é Arquitetura de Microsserviços?',
                        resposta: 'Uma abordagem de desenvolvimento que estrutura uma aplicação como uma coleção de serviços pequenos, independentes e fracamente acoplados.'
                    }
                ]
            }
        ];

        // Estado Global da Aplicação
        let decks = JSON.parse(localStorage.getItem('flashcards_3d_decks_v2')) || initialDecks;
        let deckAtualId = decks[0].id;
        let paginaAtual = 0;
        const CARDS_POR_PAGINA = 3; // Suporte para exatamente 3 cartões simultâneos no Desktop/PC
        let estadoGiro = {}; // Armazena { cardGlobalIndex: boolean }
        let statusProgresso = {}; // Armazena { deckId-cardIndex: 'sabe' | 'praticar' }

        // Elementos do DOM
        const cardsGrid = document.getElementById('cardsGrid');
        const deckSelect = document.getElementById('deckSelect');
        const novoCardDeck = document.getElementById('novoCardDeck');
        const pageCounter = document.getElementById('pageCounter');
        const deckBadge = document.getElementById('deckBadge');
        const modalCriar = document.getElementById('modalCriar');
        const countSabe = document.getElementById('countSabe');
        const countPraticar = document.getElementById('countPraticar');
        const barSabe = document.getElementById('barSabe');
        const barPraticar = document.getElementById('barPraticar');

        // Inicialização da Aplicação
        function init() {
            lucide.createIcons();
            popularDecksSelect();
            carregarDeck(deckAtualId);
            configurarAtalhosTeclado();
        }

        function popularDecksSelect() {
            deckSelect.innerHTML = '';
            novoCardDeck.innerHTML = '';

            decks.forEach(deck => {
                const opt1 = document.createElement('option');
                opt1.value = deck.id;
                opt1.textContent = `${deck.nome} (${deck.cards.length})`;
                deckSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = deck.id;
                opt2.textContent = deck.nome;
                novoCardDeck.appendChild(opt2);
            });

            deckSelect.value = deckAtualId;
        }

        deckSelect.addEventListener('change', (e) => {
            deckAtualId = e.target.value;
            paginaAtual = 0;
            estadoGiro = {};
            renderizarPaginacao();
        });

        function obterDeckAtual() {
            return decks.find(d => d.id === deckAtualId) || decks[0];
        }

        function carregarDeck(id) {
            deckAtualId = id;
            paginaAtual = 0;
            estadoGiro = {};
            renderizarPaginacao();
        }

        // Renderiza até 3 cartões simultâneos na página atual
        function renderizarPaginacao() {
            const deck = obterDeckAtual();
            const cards = deck.cards;

            deckBadge.textContent = deck.nome;
            cardsGrid.innerHTML = '';

            if (cards.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                        <p class="text-base font-medium">Nenhum flashcard neste deck.</p>
                        <p class="text-xs text-slate-600 mt-1">Clique em "Criar Card" para adicionar novos estudos.</p>
                    </div>
                `;
                pageCounter.textContent = 'Cards 0 de 0';
                atualizarControlesPaginacao();
                atualizarBarraProgresso();
                lucide.createIcons();
                return;
            }

            const inicio = paginaAtual * CARDS_POR_PAGINA;
            const fim = Math.min(inicio + CARDS_POR_PAGINA, cards.length);
            const cardsPagina = cards.slice(inicio, fim);

            pageCounter.textContent = `Exibindo cards ${inicio + 1}-${fim} de ${cards.length}`;

            // Criar elementos dos cartões 3D para o grid
            cardsPagina.forEach((card, localIdx) => {
                const globalIdx = inicio + localIdx;
                const estaVirado = !!estadoGiro[globalIdx];
                const status = statusProgresso[`${deckAtualId}-${globalIdx}`];

                const cardHtml = criarCardElementHTML(card, globalIdx, estaVirado, status);
                cardsGrid.insertAdjacentHTML('beforeend', cardHtml);
            });

            lucide.createIcons();
            ativarEfeitoGiroscopio();
            atualizarControlesPaginacao();
            atualizarBarraProgresso();
        }

        // Construtor HTML do Cartão 3D com Rotação 180° e Efeito Tilt
        function criarCardElementHTML(card, index, virado, status) {
            const statusBadge = status === 'sabe' 
                ? `<span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-md text-[10px] font-semibold flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Já sei</span>`
                : status === 'praticar'
                ? `<span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-md text-[10px] font-semibold flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Revisar</span>`
                : `<span class="px-2 py-0.5 bg-slate-800 text-slate-400 border border-slate-700 rounded-md text-[10px]">Novo</span>`;

            return `
                <div class="perspective-1200 w-full">
                    <div id="cardStage-${index}" data-card-index="${index}" class="card-stage relative w-full aspect-[4/3] cursor-pointer group">
                        
                        <!-- Lado Interno Rotativo -->
                        <div id="cardFlipper-${index}" class="card-flipper transform-style-3d relative w-full h-full shadow-2xl rounded-2xl ${virado ? 'rotate-y-180' : ''}">
                            
                            <!-- FRENTE DO CARTÃO -->
                            <div class="backface-hidden absolute inset-0 w-full h-full bg-gradient-to-br from-slate-900 via-slate-850 to-slate-900 border-2 border-slate-800 hover:border-cyan-500/40 rounded-2xl p-5 flex flex-col justify-between overflow-hidden shadow-xl transition-colors">
                                <!-- Camada de Brilho Reflexivo (Glare Overlay) -->
                                <div id="glareFront-${index}" class="glare-overlay absolute inset-0 rounded-2xl opacity-0 transition-opacity"></div>
                                
                                <div class="flex items-center justify-between z-10">
                                    <span class="flex items-center gap-1.5 text-xs font-semibold text-cyan-400">
                                        <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                                        Pergunta #${index + 1}
                                    </span>
                                    ${statusBadge}
                                </div>

                                <div class="my-auto text-center z-10 px-2 overflow-y-auto max-h-[60%]">
                                    <h3 class="text-base sm:text-lg font-semibold text-slate-100 leading-relaxed">
                                        ${card.pergunta}
                                    </h3>
                                </div>

                                <div class="flex items-center justify-between text-[11px] text-slate-500 z-10 pt-2 border-t border-slate-800/80">
                                    <button onclick="event.stopPropagation(); virarCardIndividual(${index})" class="text-cyan-400 hover:text-cyan-300 font-medium flex items-center gap-1">
                                        <i data-lucide="rotate-cw" class="w-3 h-3"></i> Virar card
                                    </button>
                                    <span class="font-mono text-[10px] text-slate-600">frente</span>
                                </div>
                            </div>

                            <!-- VERSO DO CARTÃO -->
                            <div class="backface-hidden rotate-y-180 absolute inset-0 w-full h-full bg-gradient-to-br from-slate-900 via-slate-950 to-cyan-950/80 border-2 border-cyan-500/50 rounded-2xl p-5 flex flex-col justify-between overflow-hidden shadow-xl">
                                <!-- Camada de Brilho Reflexivo Verso -->
                                <div id="glareBack-${index}" class="glare-overlay absolute inset-0 rounded-2xl opacity-0 transition-opacity"></div>

                                <div class="flex items-center justify-between z-10">
                                    <span class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400">
                                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                                        Resposta
                                    </span>
                                    <span class="text-[10px] text-slate-500">Clique para voltar</span>
                                </div>

                                <div class="my-auto text-center z-10 px-2 overflow-y-auto max-h-[60%]">
                                    <p class="text-sm sm:text-base text-slate-200 leading-relaxed font-normal">
                                        ${card.resposta}
                                    </p>
                                </div>

                                <!-- Ações de avaliação de estudo -->
                                <div class="flex items-center justify-between gap-2 z-10 pt-2 border-t border-slate-800/80">
                                    <button onclick="event.stopPropagation(); marcarCard(${index}, false)" title="Marcar como Preciso Praticar" class="flex-1 py-1.5 px-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-medium transition-colors flex items-center justify-center gap-1">
                                        <i data-lucide="x" class="w-3 h-3"></i> Revisar
                                    </button>
                                    <button onclick="event.stopPropagation(); marcarCard(${index}, true)" title="Marcar como Já Sei" class="flex-1 py-1.5 px-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-medium transition-colors flex items-center justify-center gap-1">
                                        <i data-lucide="check" class="w-3 h-3"></i> Já Sei
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;
        }

        // Rotação individual de 180 graus
        function virarCardIndividual(index) {
            estadoGiro[index] = !estadoGiro[index];
            const flipper = document.getElementById(`cardFlipper-${index}`);
            if (flipper) {
                if (estadoGiro[index]) {
                    flipper.classList.add('rotate-y-180');
                } else {
                    flipper.classList.remove('rotate-y-180');
                }
            }
        }

        function virarTodosCards() {
            const deck = obterDeckAtual();
            const inicio = paginaAtual * CARDS_POR_PAGINA;
            const fim = Math.min(inicio + CARDS_POR_PAGINA, deck.cards.length);
            
            // Verifica se algum está desvirado na página
            let temDesvirado = false;
            for (let i = inicio; i < fim; i++) {
                if (!estadoGiro[i]) {
                    temDesvirado = true;
                    break;
                }
            }

            for (let i = inicio; i < fim; i++) {
                estadoGiro[i] = temDesvirado;
                const flipper = document.getElementById(`cardFlipper-${i}`);
                if (flipper) {
                    if (temDesvirado) flipper.classList.add('rotate-y-180');
                    else flipper.classList.remove('rotate-y-180');
                }
            }
        }

        // Efeito Giroscópio / Tilt 3D com acompanhamento do mouse e iluminação dinâmica
        function ativarEfeitoGiroscopio() {
            const maxTilt = 16; // Graus máximos de inclinação

            document.querySelectorAll('.card-stage').forEach(stage => {
                const cardIdx = stage.getAttribute('data-card-index');
                
                // Clique no card altera a rotação 3D do flip
                stage.onclick = (e) => {
                    // Evita disparar ao clicar em botões específicos dentro do card
                    if (e.target.closest('button')) return;
                    virarCardIndividual(cardIdx);
                };

                stage.onmousemove = (e) => {
                    const rect = stage.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const percentX = (x - centerX) / centerX;
                    const percentY = (y - centerY) / centerY;

                    const rotateX = -percentY * maxTilt;
                    const rotateY = percentX * maxTilt;

                    // Aplica cálculo de paralaxe 3D na escala e rotação dos eixos
                    stage.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;

                    // Ajusta o gradiente do brilho de iluminação (Glare)
                    const glareFront = document.getElementById(`glareFront-${cardIdx}`);
                    const glareBack = document.getElementById(`glareBack-${cardIdx}`);
                    const isFlipped = !!estadoGiro[cardIdx];
                    const activeGlare = isFlipped ? glareBack : glareFront;

                    if (activeGlare) {
                        activeGlare.style.opacity = Math.min(Math.abs(percentX) + Math.abs(percentY), 0.5).toString();
                        activeGlare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 75%)`;
                    }
                };

                stage.onmouseleave = () => {
                    stage.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    const glareFront = document.getElementById(`glareFront-${cardIdx}`);
                    const glareBack = document.getElementById(`glareBack-${cardIdx}`);
                    if (glareFront) glareFront.style.opacity = '0';
                    if (glareBack) glareBack.style.opacity = '0';
                };
            });
        }

        // Padrão de navegação por página de 3 cards
        function proximaPagina() {
            const deck = obterDeckAtual();
            const totalPaginas = Math.ceil(deck.cards.length / CARDS_POR_PAGINA);
            if (paginaAtual < totalPaginas - 1) {
                paginaAtual++;
                renderizarPaginacao();
            }
        }

        function paginaAnterior() {
            if (paginaAtual > 0) {
                paginaAtual--;
                renderizarPaginacao();
            }
        }

        function atualizarControlesPaginacao() {
            const deck = obterDeckAtual();
            const totalPaginas = Math.ceil(deck.cards.length / CARDS_POR_PAGINA);
            
            document.getElementById('btnPrevPage').disabled = paginaAtual === 0;
            document.getElementById('btnNextPage').disabled = paginaAtual >= totalPaginas - 1 || totalPaginas === 0;
        }

        function embaralharCards() {
            const deck = obterDeckAtual();
            for (let i = deck.cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck.cards[i], deck.cards[j]] = [deck.cards[j], deck.cards[i]];
            }
            paginaAtual = 0;
            estadoGiro = {};
            renderizarPaginacao();
        }

        function marcarCard(index, sabe) {
            const key = `${deckAtualId}-${index}`;
            statusProgresso[key] = sabe ? 'sabe' : 'praticar';
            renderizarPaginacao();
        }

        function atualizarBarraProgresso() {
            const deck = obterDeckAtual();
            let sabeCount = 0;
            let praticarCount = 0;

            deck.cards.forEach((_, idx) => {
                const st = statusProgresso[`${deckAtualId}-${idx}`];
                if (st === 'sabe') sabeCount++;
                if (st === 'praticar') praticarCount++;
            });

            countSabe.textContent = sabeCount;
            countPraticar.textContent = praticarCount;

            const total = deck.cards.length || 1;
            barSabe.style.width = `${(sabeCount / total) * 100}%`;
            barPraticar.style.width = `${(praticarCount / total) * 100}%`;
        }

        function reiniciarSessao() {
            statusProgresso = {};
            estadoGiro = {};
            paginaAtual = 0;
            renderizarPaginacao();
        }

        // Modal de criação de cards
        function abrirModalCriar() {
            modalCriar.classList.remove('hidden');
        }

        function fecharModalCriar() {
            modalCriar.classList.add('hidden');
            document.getElementById('formCriarCard').reset();
        }

        function salvarNovoCard(e) {
            e.preventDefault();
            const targetDeckId = novoCardDeck.value;
            const pergunta = document.getElementById('novoCardPergunta').value.trim();
            const resposta = document.getElementById('novoCardResposta').value.trim();

            if (!pergunta || !resposta) return;

            const targetDeck = decks.find(d => d.id === targetDeckId);
            if (targetDeck) {
                targetDeck.cards.push({ pergunta, resposta });
                localStorage.setItem('flashcards_3d_decks_v2', JSON.stringify(decks));
                popularDecksSelect();

                if (targetDeckId === deckAtualId) {
                    paginaAtual = Math.floor((targetDeck.cards.length - 1) / CARDS_POR_PAGINA);
                    renderizarPaginacao();
                } else {
                    deckSelect.value = targetDeckId;
                    deckAtualId = targetDeckId;
                    paginaAtual = Math.floor((targetDeck.cards.length - 1) / CARDS_POR_PAGINA);
                    renderizarPaginacao();
                }
            }

            fecharModalCriar();
        }

        // Atalhos globais do teclado
        function configurarAtalhosTeclado() {
            document.addEventListener('keydown', (e) => {
                if (!modalCriar.classList.contains('hidden')) return;

                if (e.code === 'ArrowRight') {
                    proximaPagina();
                } else if (e.code === 'ArrowLeft') {
                    paginaAnterior();
                } else if (e.code === 'Space') {
                    e.preventDefault();
                    virarTodosCards();
                }
            });
        }

        // Inicializar aplicação
        window.onload = init;
    </script>
</body>
</html>
